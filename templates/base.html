<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Notiz-App{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav>
    <div>
        <h2>📝 Notiz-App</h2>
    </div>

    {% if session.get("user") %}
    <div>
        Hallo {{ session["user"] }} 👋
        <a href="/logout">Logout 🚪</a>
    </div>
    {% endif %}
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="message {{ category }}">
            {{ message }}
        </div>
    {% endfor %}
{% endwith %}


{% block content %}
{% endblock %}


</body>
</html>
