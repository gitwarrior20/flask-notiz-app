<!DOCTYPE html>
<html>

<head>

<title>Dashboard</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>


<body>


<div class="container">


<div class="topbar">

<h1>📊 Dashboard</h1>


<div>

<a href="/">
Notizen
</a>

|

<a href="/profil">
Profil
</a>

|

<a href="/logout">
Logout
</a>

<button id="darkmode-toggle">
    🌙
</button>

</div>


</div>




<div class="dashboard-card">


<h2>
Hallo {{ session["user"] }} 👋
</h2>


<p>
Willkommen zurück!
</p>


</div>





<div class="dashboard-grid">



<div class="stat-card">

<h2>
📝
</h2>

<h1>
{{ anzahl_notizen }}
</h1>

<p>
Notizen
</p>

</div>





<div class="stat-card">

<h2>
👤
</h2>

<h3>
{{ user[0] }}
</h3>

<p>
Benutzername
</p>

</div>





<div class="stat-card">

<h2>
🕒
</h2>

<p>
{{ letzte_aktivitaet }}
</p>

<p>
Letzte Aktivität
</p>

</div>



</div>



</div>

<script>

const button = document.getElementById("darkmode-toggle");

if (localStorage.getItem("darkmode") === "an") {

    document.body.classList.add("dark");

    button.textContent = "☀️";

}

button.onclick = function () {

    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {

        localStorage.setItem("darkmode", "an");

        button.textContent = "☀️";

    } else {

        localStorage.setItem("darkmode", "aus");

        button.textContent = "🌙";

    }

};

</script>

</body>

</html>
