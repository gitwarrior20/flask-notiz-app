<!DOCTYPE html>
<html>
<head>
    <title>Registrieren</title>
</head>

<body>

<h1>Registrieren</h1>

<form method="POST">

    <input 
    type="text" 
    name="username" 
    placeholder="Benutzername"
    required>

    <br><br>

    <input 
    type="email" 
    name="email" 
    placeholder="E-Mail"
    required>

    <br><br>

    <input 
    type="password" 
    name="password" 
    placeholder="Passwort"
    required>

    <br><br>

    <button type="submit">
        Registrieren
    </button>

</form>

</body>
</html>
